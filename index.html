    // Diagnostic error logger so black screens never happen silently
    window.addEventListener('error', function(e) {
      console.error("Pipeline Runtime Error:", e);
      var root = document.getElementById('root');
      if (root && root.getAttribute('data-mounted') !== 'true') {
        root.innerHTML = '<div style="padding: 40px; color: #f43f5e; font-family: monospace; background: #060b14; min-height: 100vh;">' +

          '<pre style="background: #0f1c3f; border: 1px solid #1c2f65; padding: 16px; border-radius: 8px; color: #f87171;">' + (e.message || e.toString()) + '</pre>' +

      }

    // --- Initial Model & Device Data ---
    const INITIAL_DEVICES = [

    const SCHEMA_DEFINITION = {
      "$schema": "urn:ietf:params:xml:ns:yang:ietf-interfaces",
      "model": "RFC 8641 YANG-Push Datastore Subscription",
      "properties": {
        "device_id": { "type": "string", "description": "Canonical network element identifier", "required": true },
        "cpu": { "type": "number", "minimum": 0, "maximum": 100, "unit": "%", "required": true },
        "memory": { "type": "number", "minimum": 0, "maximum": 100, "unit": "%", "required": true },
        "bandwidth": { "type": "number", "minimum": 0, "unit": "Mbps", "required": true },
        "packet_loss": { "type": "number", "minimum": 0, "maximum": 100, "unit": "%", "required": false },
        "latency": { "type": "number", "minimum": 0, "unit": "ms", "required": false },
        "interface": { "type": "string", "description": "Physical interface identifier", "required": false },
        "timestamp": { "type": "datetime", "format": "ISO 8601 (UTC)", "required": true }
      }
    };

    // --- State Context ---
    const AppContext = createContext();

    function AppProvider({ children }) {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [role, setRole] = useState("Admin");
      const [activePage, setActivePage] = useState("home");
      const [isGeneratorActive, setIsGeneratorActive] = useState(true);
      const [generatorInterval, setGeneratorInterval] = useState(2000);
      const [devices, setDevices] = useState(INITIAL_DEVICES);
      const [validStream, setValidStream] = useState([]);
      const [invalidStream, setInvalidStream] = useState([]);
      const [alerts, setAlerts] = useState([]);
      const [toasts, setToasts] = useState([]);
      const [showAiModal, setShowAiModal] = useState(false);
      const [showShareModal, setShowShareModal] = useState(false);
      const [selectedAnomaly, setSelectedAnomaly] = useState(null);

      const login = (email, password, selectedRole, customName) => {
        const nameMap = {
          "Admin": "Alex Rivera (NOC Lead)",
          "Engineer": "Jordan Chen (Telemetry Eng)",
          "Viewer": "Taylor Vance (Compliance Auditor)"
        };
        const userName = customName || nameMap[selectedRole] || email.split("@")[0] || "NOC Operator";
        const userObj = {
          name: userName,
          email: email || `${selectedRole.toLowerCase()}@noc.cisco.com`,
          role: selectedRole,
          loginTime: new Date().toLocaleTimeString()
        };
        setCurrentUser(userObj);
        setRole(selectedRole);
        setIsAuthenticated(true);
        addToast("success", "Access Granted", `Authenticated as ${userName} [${selectedRole} Mode]`);
      };

      const logout = () => {
        setIsAuthenticated(false);
        setCurrentUser(null);
        addToast("info", "Session Terminated", "Signed out of Telemetry Pipeline terminal.");
      };

      const addToast = (type, title, message) => {
        const id = Date.now() + Math.random();
        setToasts(prev => [{ id, type, title, message }, ...prev.slice(0, 4)]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 5000);
      };

      const validatePacket = (pkt) => {
        const errors = [];
        if (!pkt || typeof pkt !== 'object') {
          return { isValid: false, errors: ["Payload must be a valid JSON object"] };
        }

        if (!pkt.device_id || typeof pkt.device_id !== 'string') {
          errors.push(typeof pkt.device_id === 'undefined' ? "Missing required field: 'device_id'" : "Wrong data type: 'device_id' must be a string");
        }
        if (typeof pkt.cpu !== 'number' || isNaN(pkt.cpu)) {
          errors.push(typeof pkt.cpu === 'undefined' ? "Missing required field: 'cpu'" : `Wrong data type for 'cpu': expected number, got ${typeof pkt.cpu}`);
        } else if (pkt.cpu < 0 || pkt.cpu > 100) {
          errors.push(`Range violation: 'cpu' must be between 0 and 100, got ${pkt.cpu}`);
        }

        if (typeof pkt.memory !== 'number' || isNaN(pkt.memory)) {
          errors.push(typeof pkt.memory === 'undefined' ? "Missing required field: 'memory'" : `Wrong data type for 'memory': expected number, got ${typeof pkt.memory}`);
        }

        if (typeof pkt.bandwidth !== 'number' || isNaN(pkt.bandwidth)) {
          errors.push(typeof pkt.bandwidth === 'undefined' ? "Missing required field: 'bandwidth'" : `Wrong data type for 'bandwidth': expected number, got ${typeof pkt.bandwidth}`);
        }

        if (!pkt.timestamp || typeof pkt.timestamp !== 'string') {
          errors.push("Missing required field: 'timestamp'");
        } else {
          const d = new Date(pkt.timestamp);
          if (isNaN(d.getTime())) {
            errors.push(`Timestamp Error: '${pkt.timestamp}' is not valid ISO 8601 UTC`);
          }
        }

        const allowedKeys = ["device_id", "cpu", "memory", "bandwidth", "packet_loss", "latency", "interface", "timestamp"];
        const extraKeys = Object.keys(pkt).filter(k => !allowedKeys.includes(k));
        if (extraKeys.length > 0) {
          errors.push(`Schema Drift Detected: Unexpected leaves [${extraKeys.join(', ')}] not declared in YANG module`);
        }

        return { isValid: errors.length === 0, errors };
      };

      const generatePacket = (forcedErrorType = null) => {
        const dev = devices[Math.floor(Math.random() * devices.length)];
        const nowIso = new Date().toISOString();

        let cpu = Math.floor(25 + Math.random() * 45);
        let mem = Math.floor(45 + Math.random() * 35);
        let bw = Math.floor(200 + Math.random() * 700);
        let loss = Number((Math.random() * 0.8).toFixed(2));
        let lat = Number((8 + Math.random() * 25).toFixed(1));

        if (Math.random() < 0.15) {
          cpu = Math.floor(82 + Math.random() * 16);
        }
        if (Math.random() < 0.1) {
          lat = Number((105 + Math.random() * 65).toFixed(1));
        }

        let rawPayload = {
          device_id: dev.device_id,
          cpu,
          memory: mem,
          bandwidth: bw,
          packet_loss: loss,
          latency: lat,
          interface: dev.interface,
          timestamp: nowIso
        };

        const shouldCorrupt = forcedErrorType || (Math.random() < 0.20);
        if (shouldCorrupt) {
          const errKind = forcedErrorType || ['type_cpu', 'missing_id', 'drift', 'bad_ts'][Math.floor(Math.random() * 4)];
          if (errKind === 'type_cpu') {
            rawPayload.cpu = "high_utilization";
          } else if (errKind === 'missing_id') {
            delete rawPayload.device_id;
          } else if (errKind === 'drift') {
            rawPayload["vendor_undocumented_optics_flag"] = "0x88FE";
          } else if (errKind === 'bad_ts') {
            rawPayload.timestamp = "TIMESTAMP_CORRUPTED_2026";
          }
        }

        const { isValid, errors } = validatePacket(rawPayload);
        const record = {
          id: `PKT-${Date.now().toString().slice(-6)}-${Math.floor(Math.random() * 900 + 100)}`,
          payload: rawPayload,
          isValid,
          errors,
          received_at: nowIso
        };

        if (isValid) {
          setValidStream(prev => [record, ...prev.slice(0, 150)]);
          checkAlertTriggers(rawPayload);
        } else {
          setInvalidStream(prev => [record, ...prev.slice(0, 150)]);
          if (forcedErrorType) {
            addToast("warning", "Corrupted Packet Quarantined", errors[0]);
          }
        }

        return record;
      };

      const checkAlertTriggers = (pkt) => {
        const nowIso = new Date().toISOString();
        const devId = pkt.device_id || "Unknown";

        if (pkt.cpu > 80) {
          const newAlert = {
            id: `ALT-CPU-${Date.now()}`,
            device_id: devId,
            metric: "CPU Utilization",
            value: `${pkt.cpu}%`,
            threshold: "80%",
            severity: pkt.cpu > 90 ? "Critical" : "Warning",
            timestamp: nowIso,
            message: `CPU threshold violated on ${devId} (${pkt.cpu}%). Critical thread workload detected.`
          };
          setAlerts(prev => [newAlert, ...prev.slice(0, 49)]);
          if (pkt.cpu > 92) {
            addToast("danger", `CRITICAL: CPU Alert (${pkt.cpu}%)`, `${devId} exceeds safe operating threshold!`);
          }
        }

        if (pkt.memory > 90) {
          const newAlert = {
            id: `ALT-MEM-${Date.now()}`,
            device_id: devId,
            metric: "Memory Usage",
            value: `${pkt.memory}%`,
            threshold: "90%",
            severity: "Critical",
            timestamp: nowIso,
            message: `Memory buffer exhaustion risk on ${devId} (${pkt.memory}%). Packet buffering impacted.`
          };
          setAlerts(prev => [newAlert, ...prev.slice(0, 49)]);
        }

        if (pkt.latency > 100) {
          const newAlert = {
            id: `ALT-LAT-${Date.now()}`,
            device_id: devId,
            metric: "RTT Latency",
            value: `${pkt.latency}ms`,
            threshold: "100ms",
            severity: "Warning",
            timestamp: nowIso,
            message: `High latency hop detected on interface ${pkt.interface} (${pkt.latency}ms).`
          };
          setAlerts(prev => [newAlert, ...prev.slice(0, 49)]);
        }

        if (pkt.packet_loss > 5) {
          const newAlert = {
            id: `ALT-LOSS-${Date.now()}`,
            device_id: devId,
            metric: "Packet Loss",
            value: `${pkt.packet_loss}%`,
            threshold: "5%",
            severity: "Critical",
            timestamp: nowIso,
            message: `Severe line-card packet discard on ${pkt.interface} (${pkt.packet_loss}%).`
          };
          setAlerts(prev => [newAlert, ...prev.slice(0, 49)]);
        }
      };

      useEffect(() => {
        if (!isGeneratorActive) return;
        if (validStream.length === 0) {
          for (let i = 0; i < 15; i++) {
            generatePacket();
          }
        }

        const interval = setInterval(() => {
          generatePacket();
        }, generatorInterval);
        return () => clearInterval(interval);
      }, [isGeneratorActive, generatorInterval, devices]);

      const exportCsv = (type = "valid") => {
        const stream = type === "valid" ? validStream : invalidStream;
        if (stream.length === 0) {
          addToast("info", "No Telemetry to Export", "The stream buffer is currently empty.");
          return;
        }

        const headers = ["Packet_ID", "Device_ID", "CPU_%", "Memory_%", "Bandwidth_Mbps", "Packet_Loss_%", "Latency_ms", "Interface", "Timestamp", "Validation_Status", "Errors"];
        const rows = stream.map(item => {
          const p = item.payload || {};
          return [
            item.id,
            `"${p.device_id || ''}"`,
            p.cpu || '',
            p.memory || '',
            p.bandwidth || '',
            p.packet_loss || '',
            p.latency || '',
            `"${p.interface || ''}"`,
            `"${p.timestamp || ''}"`,
            item.isValid ? "VALID" : "INVALID_REJECTED",
            `"${(item.errors || []).join('; ')}"`
          ].join(',');
        });

        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `telemetry_${type}_export_${Date.now()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        addToast("success", "Export Completed", `Exported ${stream.length} ${type} telemetry records to CSV.`);
      };

      return (
        <AppContext.Provider value={{
          isAuthenticated, setIsAuthenticated,
          currentUser, setCurrentUser,
          login, logout,
          role, setRole,
          activePage, setActivePage,
          isGeneratorActive, setIsGeneratorActive,
          generatorInterval, setGeneratorInterval,
          devices, setDevices,
          validStream, invalidStream,
          alerts, setAlerts,
          toasts, addToast,
          generatePacket, validatePacket,
          exportCsv,
          showAiModal, setShowAiModal,
          showShareModal, setShowShareModal,
          selectedAnomaly, setSelectedAnomaly
        }}>
          {children}
        </AppContext.Provider>
      );
    }

    // --- PAGE 4: VALIDATION PAGE ---
    function ValidationPage() {
      const { validStream, invalidStream, generatePacket, role, exportCsv } = useContext(AppContext);
      const [activeTab, setActiveTab] = useState("invalid");
      const [customJsonInput, setCustomJsonInput] = useState(JSON.stringify({
        device_id: "Router-01",
        cpu: "OVERFLOW_STRING",
        memory: 64,
        bandwidth: 320,
        timestamp: "2026-01-12T12:30:00Z"
      }, null, 2));
      const [testResult, setTestResult] = useState(null);

      const runCustomTest = () => {
        try {
          const parsed = JSON.parse(customJsonInput);
          const errors = [];
          if (!parsed.device_id || typeof parsed.device_id !== 'string') errors.push("Wrong data type or missing 'device_id'");
          if (typeof parsed.cpu !== 'number') errors.push("Wrong Data Type: CPU must be a number");
          if (typeof parsed.memory !== 'number') errors.push("Wrong Data Type: Memory must be a number");
          if (typeof parsed.bandwidth !== 'number') errors.push("Wrong Data Type: Bandwidth must be a number");
          if (!parsed.timestamp || isNaN(new Date(parsed.timestamp).getTime())) errors.push("Timestamp Error: invalid ISO 8601 date");
          
          setTestResult({
            isValid: errors.length === 0,
            errors
          });
        } catch (e) {
          setTestResult({ isValid: false, errors: ["Invalid JSON syntax: " + e.message] });
        }
      };

      return (
        <div className="space-y-6 pb-16">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-bold text-white tracking-tight flex items-center gap-2">
                <Icon name="shield-check" className="w-6 h-6 text-cisco-cyan" />
                YANG Telemetry Schema Validation Center
              </h1>
              <p className="text-xs text-slate-400 mt-1">Real-time conformance enforcement against authoritative RFC 7950 models.</p>
            </div>
            <div className="flex items-center gap-2">
              {role === "Admin" && (
                <div className="flex gap-2">
                  <button 
                    onClick={() => generatePacket("type_cpu")}
                    className="px-3.5 py-1.5 rounded-xl bg-white text-black font-extrabold text-xs hover:bg-slate-200 transition-all shadow-sm">
                    + Type Fault
                  </button>
                  <button 
                    onClick={() => generatePacket("missing_id")}
                    className="px-3.5 py-1.5 rounded-xl bg-white text-black font-extrabold text-xs hover:bg-slate-200 transition-all shadow-sm">
                    + Missing Field
                  </button>
                  <button 
                    onClick={() => generatePacket("drift")}
                    className="px-3.5 py-1.5 rounded-xl bg-white text-black font-extrabold text-xs hover:bg-slate-200 transition-all shadow-sm">
                    + Schema Drift
                  </button>
                </div>
              )}
              <button 
                onClick={() => exportCsv("invalid")}
                className="px-4 py-2 rounded-xl bg-white text-black font-extrabold text-xs hover:bg-slate-200 transition-all shadow-md flex items-center gap-1.5">
                <Icon name="download" className="w-3.5 h-3.5 text-black" />
                Export DLQ
              </button>
            </div>
          </div>

          <div className="flex items-center gap-3 border-b border-cisco-border pb-3">
            <button
              onClick={() => setActiveTab("invalid")}
              className={`px-4 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${
                activeTab === "invalid"
                  ? 'bg-white text-black shadow-lg shadow-white/10'
                  : 'text-slate-400 hover:text-white hover:bg-white/5'
              }`}>
              <Icon name="alert-octagon" className={`w-3.5 h-3.5 ${activeTab === 'invalid' ? 'text-black' : 'text-slate-400'}`} />
              Quarantined Invalid Telemetry ({invalidStream.length})
            </button>
            <button
              onClick={() => setActiveTab("valid")}
              className={`px-4 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${
                activeTab === "valid"
                  ? 'bg-white text-black shadow-lg shadow-white/10'
                  : 'text-slate-400 hover:text-white hover:bg-white/5'
              }`}>
              <Icon name="check-circle" className={`w-3.5 h-3.5 ${activeTab === 'valid' ? 'text-black' : 'text-slate-400'}`} />
              Verified Clean Stream ({validStream.length})
            </button>
            <button
              onClick={() => setActiveTab("schema")}
              className={`px-4 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${
                activeTab === "schema"
                  ? 'bg-white text-black shadow-lg shadow-white/10'
                  : 'text-slate-400 hover:text-white hover:bg-white/5'
              }`}>
              <Icon name="file-code" className={`w-3.5 h-3.5 ${activeTab === 'schema' ? 'text-black' : 'text-slate-400'}`} />
              Active YANG Schema Specification
            </button>
          </div>

          {activeTab === "invalid" && (
            <div className="space-y-4">
              <div className="p-4 rounded-xl bg-rose-950/20 border border-rose-500/30 text-rose-300 text-xs flex items-center justify-between">
                <span>
                  <strong>Dead-Letter Queue (DLQ):</strong> All packets failing type checking, range validation, or timestamp integrity are diverted here to prevent database poisoning.
                </span>
                <span className="font-mono font-bold">{invalidStream.length} Packets Blocked</span>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {invalidStream.slice(0, 8).map(pkt => (
                  <div key={pkt.id} className="p-5 rounded-2xl bg-cisco-surface border border-rose-500/30 space-y-3 font-mono text-xs">
                    <div className="flex items-center justify-between">
                      <span className="px-2 py-0.5 rounded bg-rose-500/20 text-rose-400 border border-rose-500/30 font-bold text-[10px]">
                        FAIL: REJECTED
                      </span>
                      <span className="text-slate-500 text-[10px]">{pkt.id}</span>
                    </div>

                    <div className="p-3 rounded-xl bg-rose-950/40 border border-rose-500/20 space-y-1">
                      <div className="text-[10px] uppercase font-bold text-rose-400">Validation Errors:</div>
                      {pkt.errors?.map((err, i) => (
                        <div key={i} className="text-rose-200 text-xs flex items-start gap-1.5">
                          <span className="text-rose-400">✖</span>
                          <span>{err}</span>
                        </div>
                      ))}
                    </div>

                    <pre className="bg-cisco-navy p-3 rounded-xl text-[11px] text-slate-300 overflow-x-auto border border-cisco-border">
                      {JSON.stringify(pkt.payload, null, 2)}
                    </pre>
                  </div>
                ))}
              </div>
            </div>
          )}

          {activeTab === "valid" && (
            <div className="space-y-4">
              <div className="p-4 rounded-xl bg-emerald-950/20 border border-emerald-500/30 text-emerald-300 text-xs flex items-center justify-between">
                <span>
                  <strong>Clean Ingestion Queue:</strong> Conforms 100% to RFC 7951 JSON encoding and passes all type bounds.
                </span>
                <span className="font-mono font-bold">{validStream.length} Packets Approved</span>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {validStream.slice(0, 6).map(pkt => (
                  <div key={pkt.id} className="p-5 rounded-2xl bg-cisco-surface border border-emerald-500/30 space-y-3 font-mono text-xs">
                    <div className="flex items-center justify-between">
                      <span className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold text-[10px]">
                        PASS: 200 INGESTED
                      </span>
                      <span className="text-slate-500 text-[10px]">{pkt.id}</span>
                    </div>
                    <pre className="bg-cisco-navy p-3 rounded-xl text-[11px] text-emerald-300 overflow-x-auto border border-cisco-border">
                      {JSON.stringify(pkt.payload, null, 2)}
                    </pre>
                  </div>
                ))}
              </div>
            </div>
          )}

          {activeTab === "schema" && (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div className="p-6 rounded-2xl bg-cisco-surface border border-cisco-border space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-white text-sm">Authoritative YANG Schema Rules</h3>
                  <span className="text-xs font-mono text-cisco-cyan">RFC 8641 / RFC 7951</span>
                </div>
                <pre className="bg-cisco-navy p-4 rounded-xl text-xs font-mono text-cyan-300 overflow-x-auto max-h-[480px] border border-cisco-border">
                  {JSON.stringify(SCHEMA_DEFINITION, null, 2)}
                </pre>
              </div>

              <div className="p-6 rounded-2xl bg-cisco-surface border border-cisco-border space-y-4 flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <h3 className="font-bold text-white text-sm">Interactive Schema Validator</h3>
                    <span className="text-xs text-slate-400 font-mono">Test Custom Payload</span>
                  </div>
                  <textarea
                    rows="10"
                    value={customJsonInput}
                    onChange={(e) => setCustomJsonInput(e.target.value)}
                    className="w-full bg-cisco-navy rounded-xl p-4 font-mono text-xs text-slate-200 border border-cisco-border focus:outline-none focus:border-cisco-cyan"
                  />
                  <button
                    onClick={runCustomTest}
                    className="mt-3 w-full py-3.5 rounded-2xl bg-white text-black font-extrabold text-xs hover:bg-slate-200 shadow-xl shadow-white/10 transition-all flex items-center justify-center gap-2">
                    <Icon name="zap" className="w-4 h-4 text-black" /> Validate JSON Payload Against Schema
                  </button>
                </div>

                {testResult && (
                  <div className={`p-4 rounded-xl border font-mono text-xs transition-all ${
                    testResult.isValid ? 'bg-emerald-950/30 border-emerald-500/40 text-emerald-300' : 'bg-rose-950/30 border-rose-500/40 text-rose-300'
                  }`}>
                    <div className="font-bold flex items-center gap-1.5">
                      <Icon name={testResult.isValid ? 'check-circle' : 'alert-octagon'} className="w-4 h-4" />
                      {testResult.isValid ? "RESULT: SCHEMA COMPLIANT (PASS)" : "RESULT: VALIDATION FAILED (QUARANTINED)"}
                    </div>
                    {!testResult.isValid && (
                      <ul className="mt-2 space-y-1 text-rose-200 text-[11px]">
                        {testResult.errors.map((e, idx) => (
                          <li key={idx}>✖ {e}</li>
                        ))}
                      </ul>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- PAGE 5: DEVICE MANAGEMENT ---
    function DevicesPage() {
      const { devices, setDevices, addToast, role } = useContext(AppContext);

      const triggerReboot = (devId) => {
        if (role === "Viewer") {
          addToast("warning", "Access Denied", "Viewer role cannot trigger device state changes.");
          return;
        }
        addToast("info", "Subscription Re-negotiation", `Sent RFC 8641 establish-subscription RPC to ${devId}`);
        setDevices(prev => prev.map(d => d.device_id === devId ? { ...d, status: "Syncing..." } : d));
        setTimeout(() => {
          setDevices(prev => prev.map(d => d.device_id === devId ? { ...d, status: "Online", health: 99 } : d));
          addToast("success", "Session Re-Established", `${devId} telemetry streaming is nominal.`);
        }, 2000);
      };

      return (
        <div className="space-y-6 pb-16">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-bold text-white tracking-tight flex items-center gap-2">
                <Icon name="server" className="w-6 h-6 text-cisco-cyan" />
                Connected Telemetry Elements
              </h1>
              <p className="text-xs text-slate-400 mt-1">Configured dial-out & dial-in telemetry endpoints streaming via RFC 8641.</p>
            </div>
            <div className="text-xs font-mono text-cisco-cyan bg-cisco-surface px-3 py-1.5 rounded-xl border border-cisco-border">
              Total Active Nodes: {devices.length}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {devices.map(dev => (
              <div key={dev.device_id} className="p-6 rounded-2xl bg-cisco-surface border border-cisco-border space-y-4">
                <div className="flex items-center justify-between">
                  <div>
                    <h3 className="font-extrabold text-white text-base flex items-center gap-2">
                      <span className={`w-2.5 h-2.5 rounded-full ${dev.status === 'Online' ? 'bg-emerald-400' : 'bg-amber-400'}`}></span>
                      {dev.device_id}
                    </h3>
                    <span className="text-xs text-slate-400 font-mono">{dev.vendor} • {dev.role}</span>
                  </div>
                  <span className={`px-2.5 py-1 rounded-full text-xs font-mono font-bold ${
                    dev.status === 'Online' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                  }`}>
                    {dev.status}
                  </span>
                </div>

                <div className="grid grid-cols-2 gap-3 text-xs font-mono">
                  <div className="p-3 rounded-xl bg-cisco-navy border border-cisco-border">
                    <span className="text-slate-500 text-[10px] uppercase">Management IP</span>
                    <div className="text-slate-200 font-bold mt-0.5">{dev.ip}</div>
                  </div>
                  <div className="p-3 rounded-xl bg-cisco-navy border border-cisco-border">
                    <span className="text-slate-500 text-[10px] uppercase">Subscription Type</span>
                    <div className="text-cisco-cyan font-bold mt-0.5">{dev.sub_type}</div>
                  </div>
                  <div className="p-3 rounded-xl bg-cisco-navy border border-cisco-border">
                    <span className="text-slate-500 text-[10px] uppercase">Subscription ID</span>
                    <div className="text-slate-200 font-bold mt-0.5">{dev.sub_id}</div>
                  </div>
                  <div className="p-3 rounded-xl bg-cisco-navy border border-cisco-border">
                    <span className="text-slate-500 text-[10px] uppercase">Telemetry Uptime</span>
                    <div className="text-slate-200 font-bold mt-0.5">{dev.uptime}</div>
                  </div>
                </div>

                <div className="space-y-1.5 font-mono text-xs">
                  <div className="flex justify-between text-slate-400 text-[11px]">
                    <span>Node Health Score:</span>
                    <span className="text-white font-bold">{dev.health}%</span>
                  </div>
                  <div className="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                    <div 
                      className={`h-2 rounded-full ${dev.health > 85 ? 'bg-emerald-400' : 'bg-amber-400'}`}
                      style={{ width: `${dev.health}%` }}></div>
                  </div>
                </div>

                <div className="pt-3 border-t border-cisco-border flex items-center justify-between text-xs">
                  <span className="text-slate-400 font-mono text-[11px]">{dev.location}</span>
                  <button
                    onClick={() => triggerReboot(dev.device_id)}
                    className="px-3.5 py-2 rounded-xl bg-white text-black font-extrabold hover:bg-slate-200 text-xs flex items-center gap-1.5 shadow-md transition-all">
                    <Icon name="refresh-cw" className="w-3.5 h-3.5 text-black" />
                    Sync YANG Tree
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- PAGE 6: ALERT MONITORING ---
    function AlertsPage() {
      const { alerts, setAlerts, addToast, role } = useContext(AppContext);
      const [severityFilter, setSeverityFilter] = useState("ALL");

      const filteredAlerts = useMemo(() => {
        return alerts.filter(a => severityFilter === "ALL" || a.severity === severityFilter);
      }, [alerts, severityFilter]);

      const clearAllAlerts = () => {
        if (role === "Viewer") {
          addToast("warning", "Unauthorized", "Viewer cannot clear alerts.");
          return;
        }
        setAlerts([]);
        addToast("success", "Alerts Cleared", "All active alarms have been resolved.");
      };

      return (
        <div className="space-y-6 pb-16">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-bold text-white tracking-tight flex items-center gap-2">
                <Icon name="alert-triangle" className="w-6 h-6 text-amber-400" />
                Real-Time Telemetry Alert Monitoring
              </h1>
              <p className="text-xs text-slate-400 mt-1">Autonomous triggers: CPU &gt; 80%, Memory &gt; 90%, Packet Loss &gt; 5%, Latency &gt; 100ms.</p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={clearAllAlerts}
                className="px-4 py-2 rounded-xl bg-white text-black font-extrabold text-xs hover:bg-slate-200 shadow-md transition-all">
                Clear All Alarms
              </button>
            </div>
          </div>

          <div className="p-4 rounded-2xl bg-cisco-surface border border-cisco-border flex items-center justify-between gap-4 text-xs font-mono">
            <div className="flex items-center gap-2">
              <span className="text-slate-400">Severity:</span>
              <button 
                onClick={() => setSeverityFilter("ALL")}
                className={`px-3.5 py-1.5 rounded-xl font-bold transition-all ${severityFilter === 'ALL' ? 'bg-white text-black shadow-md' : 'border border-cisco-border text-slate-400 hover:text-white'}`}>
                All ({alerts.length})
              </button>
              <button 
                onClick={() => setSeverityFilter("Critical")}
                className={`px-3.5 py-1.5 rounded-xl font-bold transition-all ${severityFilter === 'Critical' ? 'bg-white text-black shadow-md' : 'border border-cisco-border text-slate-400 hover:text-white'}`}>
                Critical
              </button>
              <button 
                onClick={() => setSeverityFilter("Warning")}
                className={`px-3.5 py-1.5 rounded-xl font-bold transition-all ${severityFilter === 'Warning' ? 'bg-white text-black shadow-md' : 'border border-cisco-border text-slate-400 hover:text-white'}`}>
                Warning
              </button>
            </div>

            <span className="text-slate-500 text-[11px] hidden sm:block">Automated SLA Threshold Engine</span>
          </div>

          <div className="space-y-3">
            {filteredAlerts.length === 0 ? (
              <div className="p-12 rounded-2xl bg-cisco-surface border border-cisco-border text-center text-slate-400 font-mono text-xs">
                <Icon name="check-circle" className="w-8 h-8 text-emerald-400 mx-auto mb-2" />
                All telemetry metrics operating within nominal SLA limits. No active alerts.
              </div>
            ) : (
              filteredAlerts.map(a => (
                <div key={a.id} className="p-4 rounded-xl bg-cisco-surface border border-cisco-border flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs font-mono hover:border-slate-600 transition-all">
                  <div className="flex items-start gap-3">
                    <span className={`w-2.5 h-2.5 rounded-full mt-1 shrink-0 ${a.severity === 'Critical' ? 'bg-rose-500 animate-ping' : 'bg-amber-400'}`}></span>
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-white text-sm">{a.device_id}</span>
                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${a.severity === 'Critical' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}`}>
                          {a.severity}
                        </span>
                        <span className="text-slate-500 text-[10px]">{a.id}</span>
                      </div>
                      <p className="text-slate-300 text-xs mt-1">{a.message}</p>
                    </div>
                  </div>

                  <div className="flex items-center gap-4 text-[11px] text-slate-400 self-end sm:self-center shrink-0">
                    <div>Value: <span className="text-white font-bold">{a.value}</span></div>
                    <div>Threshold: <span className="text-amber-400">{a.threshold}</span></div>
                    <span className="text-slate-500">{a.timestamp?.slice(11, 19)} UTC</span>
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    // --- PAGE 7: ARCHITECTURE PAGE ---
    function ArchitecturePage() {
      const stages = [
        {
          num: "01",
          title: "Network Elements",
          sub: "Cisco, Juniper, Arista routers & switches",
          desc: "Hardware ASIC & control planes expose live operational telemetry through YANG model datastores."
        },
        {
          num: "02",
          title: "YANG-Push Subscription",
          sub: "RFC 8641 Dial-Out / Dial-In",
          desc: "Device pushes periodic datastore snapshots or on-change notifications over HTTP/2, gRPC or WebSocket."
        },
        {
          num: "03",
          title: "Telemetry Collector",
          sub: "High-Throughput Ingestion Queue",
          desc: "Receives raw RFC 7951 JSON or Protobuf payload buffers without blocking the device pipeline."
        },
        {
          num: "04",
          title: "Schema Validator",
          sub: "RFC 7950 Semantic Engine",
          desc: "Verifies type fidelity, mandatory keys, numeric bounds, and regex constraints. Catches firmware schema drift."
        },
        {
          num: "05",
          title: "Dual Storage Routing",
          sub: "Clean DB & Dead-Letter Queue",
          desc: "Clean records persist to TimescaleDB/ClickHouse; malformed packets isolate in DLQ quarantine."
        },
        {
          num: "06",
          title: "AIOps Analytics Engine",
          sub: "Heuristic Anomaly Detection",
          desc: "Detects metric deviations, predicts link saturation, and explains root cause in natural language."
        },
        {
          num: "07",
          title: "Observability Dashboard",
          sub: "NOC & Engineering View",
          desc: "Visualizes latency, CPU, and packet loss trends across multi-vendor networks in real-time."
        },
        {
          num: "08",
          title: "Autonomous Alerting",
          sub: "SLA Threshold Breaches",
          desc: "Triggers incident notifications, PagerDuty webhooks, and automatic remediation playbooks."
        }
      ];

      return (
        <div className="space-y-8 pb-16">
          <div>
            <h1 className="text-2xl font-bold text-white tracking-tight flex items-center gap-2">
              <Icon name="git-merge" className="w-6 h-6 text-cisco-cyan" />
              Pipeline Architecture & Execution Flow
            </h1>
            <p className="text-xs text-slate-400 mt-1">End-to-end telemetry lifecycle from device silicon to SLA automated triggers.</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            {stages.map((st) => (
              <div key={st.num} className="p-6 rounded-2xl bg-cisco-surface border border-cisco-border relative flex flex-col justify-between hover:border-cisco-cyan/60 transition-all group">
                <div>
                  <div className="flex items-center justify-between mb-3">
                    <span className="text-xl font-extrabold font-mono text-cisco-cyan">{st.num}</span>
                    <span className="text-[10px] font-mono text-slate-500 uppercase">Stage</span>
                  </div>
                  <h3 className="font-bold text-white text-base group-hover:text-cisco-cyan transition-colors">{st.title}</h3>
                  <div className="text-xs font-mono text-cisco-accent mt-0.5">{st.sub}</div>
                  <p className="text-xs text-slate-300 mt-3 leading-relaxed">{st.desc}</p>
                </div>
                <div className="pt-4 mt-4 border-t border-cisco-border/60 flex items-center justify-between text-[10px] font-mono text-slate-500">
                  <span>RFC Compliance</span>
                  <span className="text-emerald-400">Deterministic</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- PAGE 8: ANALYTICS PAGE ---

      return (
        <div className="space-y-6 pb-16">

            <div className="p-5 rounded-2xl bg-cisco-surface border border-cisco-border">
              <span className="text-xs font-mono text-slate-400">Aggregated Traffic</span>
              <div className="text-3xl font-extrabold font-mono text-cisco-cyan mt-2">1,840 Mbps</div>
              <div className="text-[11px] text-slate-400 mt-1 font-mono">Concurrent Stream Volume</div>
            </div>
            <div className="p-5 rounded-2xl bg-cisco-surface border border-cisco-border">
              <span className="text-xs font-mono text-slate-400">Avg Packet Loss</span>
              <div className="text-3xl font-extrabold font-mono text-white mt-2">0.03%</div>
              <div className="text-[11px] text-emerald-400 mt-1 font-mono">Well within 0.1% SLA</div>
            </div>

            <div className="p-6 rounded-2xl bg-cisco-surface border border-cisco-border space-y-4">

                    </div>
                  </div>

            </div>

            <div className="p-6 rounded-2xl bg-cisco-surface border border-cisco-border space-y-4">
              <h3 className="font-bold text-white text-sm">Schema Conformance Benchmark</h3>
              <div className="p-4 rounded-xl bg-cisco-navy border border-cisco-border space-y-3 font-mono text-xs">
                <div className="flex justify-between">
                  <span className="text-slate-400">Valid Telemetry Ratio:</span>
                  <span className="text-emerald-400 font-bold">81.2%</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400">Quarantined Schema Drift:</span>
                  <span className="text-rose-400 font-bold">18.8%</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400">Avg Validation Latency:</span>
                  <span className="text-cisco-cyan font-bold">1.4ms</span>

              <p className="text-xs text-slate-400 leading-relaxed">
                By performing schema inspection in-line, the platform successfully quarantined 18.8% of corrupted telemetry, protecting timeseries storage from null values and index fragmentation.

      );
    }

    // --- PAGE 9: ABOUT PAGE ---
    function AboutPage() {
      return (
        <div className="space-y-8 pb-16 max-w-4xl">
          <div>
            <h1 className="text-2xl sm:text-3xl font-extrabold text-white tracking-tight flex items-center gap-3">
              <Icon name="book-open" className="w-7 h-7 text-cisco-cyan" />
              About the Project: Schema-Validated YANG-Push Pipeline
            </h1>
            <p className="text-xs sm:text-sm text-slate-400 mt-2 leading-relaxed">
              Academic & industry reference guide for modern model-driven network observability.
            </p>
          </div>

          <div className="p-6 rounded-2xl bg-cisco-surface border border-cisco-border space-y-4">
            <h2 className="text-lg font-bold text-white">What is YANG? (RFC 7950)</h2>
            <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
              <strong>YANG</strong> (Yet Another Next Generation) is the IETF standard data modeling language for network configuration and state. Unlike freeform text CLI or obscure SNMP MIBs, YANG defines unambiguous hierarchical data trees with strict data typing, range limits, and mandatory keys.
            </p>
            <h2 className="text-lg font-bold text-white pt-2">What is YANG-Push? (RFC 8639 / RFC 8641)</h2>
            <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
              YANG-Push establishes subscriptions on network devices that push telemetry data continuously or when specific on-change events trigger. This eliminates the polling tax of SNMP and provides near-zero latency insight into network state.
            </p>
          </div>

          <div className="p-6 rounded-2xl bg-cisco-surface border border-cisco-border space-y-4">
            <h2 className="text-lg font-bold text-white">Why Schema Validation? (SNMP vs YANG-Push)</h2>
            <div className="overflow-x-auto">
              <table className="w-full text-xs font-mono text-left">
                <thead className="bg-cisco-navy text-slate-400 border-b border-cisco-border">
                  <tr>
                    <th className="py-2.5 px-4">Dimension</th>
                    <th className="py-2.5 px-4 text-rose-300">Traditional SNMP Polling</th>
                    <th className="py-2.5 px-4 text-cisco-cyan">YANG-Push + Schema Validation</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-cisco-border text-slate-300">
                  <tr>
                    <td className="py-3 px-4 font-bold text-white">Architecture</td>
                    <td className="py-3 px-4">Pull-based (periodic get-requests)</td>
                    <td className="py-3 px-4 font-bold text-emerald-400">Push-based (event & periodic streams)</td>
                  </tr>
                  <tr>
                    <td className="py-3 px-4 font-bold text-white">Data Modeling</td>
                    <td className="py-3 px-4">SMIv2 MIBs (rigid, flat, vendor-inconsistent)</td>
                    <td className="py-3 px-4 font-bold text-emerald-400">Standard YANG modules (OpenConfig / IETF)</td>
                  </tr>
                  <tr>
                    <td className="py-3 px-4 font-bold text-white">CPU Overhead</td>
                    <td className="py-3 px-4">High device CPU spikes during polling</td>
                    <td className="py-3 px-4 font-bold text-emerald-400">Minimal hardware ASIC streaming</td>
                  </tr>
                  <tr>
                    <td className="py-3 px-4 font-bold text-white">Schema Conformance</td>
                    <td className="py-3 px-4">None; parses freeform strings</td>
                    <td className="py-3 px-4 font-bold text-emerald-400">Strict in-line semantic validation</td>
                  </tr>
                  <tr>
                    <td className="py-3 px-4 font-bold text-white">AIOps Readiness</td>
                    <td className="py-3 px-4">Poor (missing timestamps, clock skew)</td>
                    <td className="py-3 px-4 font-bold text-emerald-400">Pristine, synchronized time-series</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <div className="p-6 rounded-2xl bg-cisco-surface border border-cisco-border space-y-4">
            <h2 className="text-lg font-bold text-white">Real-World Telecom & Cloud Monitoring Use Cases</h2>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs text-slate-300">
              <div className="p-4 rounded-xl bg-cisco-navy border border-cisco-border space-y-1.5">
                <div className="font-bold text-cisco-cyan text-sm">5G Core Network Slicing</div>
                <p>Ensures that SLA packet loss and jitter metrics streamed by user-plane functions conform to carrier QoS models.</p>
              </div>
              <div className="p-4 rounded-xl bg-cisco-navy border border-cisco-border space-y-1.5">
                <div className="font-bold text-cisco-cyan text-sm">Hyperscale Cloud Spine Fabric</div>
                <p>Isolates telemetry corruption during rolling firmware upgrades across tens of thousands of leaf-spine switches.</p>
              </div>
              <div className="p-4 rounded-xl bg-cisco-navy border border-cisco-border space-y-1.5">
                <div className="font-bold text-cisco-cyan text-sm">Subsea Optical Cable Monitoring</div>
                <p>Validates optical signal-to-noise ratio (OSNR) and pre-FEC bit error rates in real-time.</p>
              </div>
              <div className="p-4 rounded-xl bg-cisco-navy border border-cisco-border space-y-1.5">
                <div className="font-bold text-cisco-cyan text-sm">Automated AIOps Incident Remediation</div>
                <p>Feeds clean, validated telemetry to machine learning models to prevent hallucinations and false positive alerts.</p>
              </div>
            </div>
          </div>
        </div>
      );
    }


    // ==========================================
    // LOGIN / AUTHENTICATION PAGE
    // ==========================================
    // ==========================================
    // LOGIN / AUTHENTICATION PAGE (PIXEL-PERFECT REPLICA)
    // ==========================================
    // ==========================================
    // LOGIN / AUTHENTICATION PAGE (BLACK BG + WHITE BUTTONS)
    // ==========================================
    function LoginPage() {
      const { login } = useContext(AppContext);
      const [authMode, setAuthMode] = useState("signin");
      const [email, setEmail] = useState("admin@telemetry.noc");
      const [password, setPassword] = useState("password123");
      const [showPassword, setShowPassword] = useState(false);
      const [selectedRole, setSelectedRole] = useState("Admin");
      const [isSubmitting, setIsSubmitting] = useState(false);

      const handleSubmit = (e) => {
        if (e) e.preventDefault();
        setIsSubmitting(true);
        setTimeout(() => {
          login(email, password, selectedRole);
          setIsSubmitting(false);
        }, 350);
      };

      const handleQuickDemo = (roleType, emailPrefill, namePrefill) => {
        setEmail(emailPrefill);
        setSelectedRole(roleType);
        setIsSubmitting(true);
        setTimeout(() => {
          login(emailPrefill, "secret123", roleType, namePrefill);
          setIsSubmitting(false);
        }, 250);
      };

      return (
        <div className="min-h-screen bg-black flex items-center justify-center p-4 sm:p-6 font-sans antialiased relative overflow-hidden telemetry-grid selection:bg-white selection:text-black">
          {/* Subtle Ambient Radial Lighting */}
          <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[500px] bg-gradient-to-b from-cisco-cyan/10 via-cisco-blue/5 to-transparent blur-3xl pointer-events-none -z-10"></div>

          {/* High-Contrast Card with Dark Surface */}
          <div className="w-full max-w-[440px] bg-[#0A101F] border border-slate-800 rounded-[32px] p-8 sm:p-10 shadow-2xl shadow-cyan-950/20 text-white relative backdrop-blur-xl">
            
            {/* Top Shield Icon in soft dark container with crisp white icon */}
            <div className="w-16 h-16 rounded-2xl bg-white/10 border border-white/20 flex items-center justify-center mx-auto mb-6 shadow-inner">
              <svg 
                className="w-8 h-8 text-white" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2.2" 
                strokeLinecap="round" 
                strokeLinejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              </svg>
            </div>

            {/* Title & Subtitle */}
            <div className="text-center mb-7">
              <h1 className="text-2xl sm:text-[26px] font-extrabold text-white tracking-tight leading-tight">
                Sign In to YANG-Push Telemetry
              </h1>
              <p className="text-xs sm:text-[13px] text-slate-400 mt-2 font-normal leading-relaxed">
                Schema-Validated RFC 8641 Telemetry Pipeline & Anomaly Defense
              </p>
            </div>

            {/* Segmented Tab Switcher with White Active Button */}
            <div className="bg-[#040812] p-1.5 rounded-2xl flex items-center mb-6 border border-slate-800/90">
              <button
                type="button"
                onClick={() => setAuthMode("signin")}
                className={`flex-1 py-2.5 px-4 text-xs sm:text-sm font-bold rounded-xl transition-all text-center ${
                  authMode === "signin"
                    ? "bg-white text-black shadow-lg shadow-white/10"
                    : "text-slate-400 hover:text-white"
                }`}>
                Sign In
              </button>
              <button
                type="button"
                onClick={() => setAuthMode("create")}
                className={`flex-1 py-2.5 px-4 text-xs sm:text-sm font-bold rounded-xl transition-all text-center ${
                  authMode === "create"
                    ? "bg-white text-black shadow-lg shadow-white/10"
                    : "text-slate-400 hover:text-white"
                }`}>
                Create Account
              </button>
            </div>

            {/* Form */}
            <form onSubmit={handleSubmit} className="space-y-4">
              
              {/* EMAIL ADDRESS */}
              <div className="space-y-1.5 text-left">
                <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-400">
                  EMAIL ADDRESS
                </label>
                <div className="relative rounded-2xl border border-slate-800 bg-[#040812] focus-within:border-white focus-within:ring-2 focus-within:ring-white/20 transition-all">
                  <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <Icon name="mail" className="w-4 h-4 text-slate-400" />
                  </div>
                  <input
                    type="email"
                    required
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder="Enter your email"
                    className="w-full pl-10 pr-4 py-3 text-sm text-white placeholder-slate-500 bg-transparent outline-none font-normal rounded-2xl font-mono"
                  />
                </div>
              </div>

              {/* PASSWORD */}
              <div className="space-y-1.5 text-left pt-1">
                <div className="flex items-center justify-between">
                  <label className="text-[11px] font-bold uppercase tracking-wider text-slate-400">
                    PASSWORD
                  </label>
                  <a 
                    href="#forgot" 
                    onClick={(e) => { e.preventDefault(); alert("Password reset link dispatched to " + email); }}
                    className="text-xs font-semibold text-slate-300 hover:text-white transition-colors">
                    Forgot password?
                  </a>
                </div>
                <div className="relative rounded-2xl border border-slate-800 bg-[#040812] focus-within:border-white focus-within:ring-2 focus-within:ring-white/20 transition-all">
                  <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <Icon name="key" className="w-4 h-4 text-slate-400" />
                  </div>
                  <input
                    type={showPassword ? "text" : "password"}
                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="Enter your password"
                    className="w-full pl-10 pr-11 py-3 text-sm text-white placeholder-slate-500 bg-transparent outline-none font-normal rounded-2xl font-mono"
                  />
                  <button
                    type="button"
                    onClick={() => setShowPassword(!showPassword)}
                    className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white transition-colors">
                    <Icon name={showPassword ? "eye-off" : "eye"} className="w-4 h-4 text-slate-400" />
                  </button>
                </div>
              </div>

              {/* White Submit Button with Black Text */}
              <button
                type="submit"
                disabled={isSubmitting}
                className="w-full py-3.5 rounded-2xl bg-white hover:bg-slate-200 active:scale-[0.99] text-black font-extrabold text-sm shadow-xl shadow-white/10 flex items-center justify-center gap-2 mt-6 transition-all">
                {isSubmitting ? (
                  <div className="w-4 h-4 border-2 border-black border-t-transparent rounded-full animate-spin"></div>
                ) : (
                  <>
                    <span>{authMode === "signin" ? "Sign In" : "Create Account"}</span>
                    <span className="text-base font-black leading-none">→</span>
                  </>
                )}
              </button>
            </form>

            {/* Instant Demo Access (All White Buttons) */}
            <div className="mt-7 pt-5 border-t border-slate-800 text-center">
              <div className="text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-2.5 font-semibold">
                Instant Demo Access:
              </div>
              <div className="flex items-center justify-center gap-2">
                <button
                  type="button"
                  onClick={() => handleQuickDemo("Admin", "admin@telemetry.noc", "Alex Rivera (NOC Lead)")}
                  className="px-3.5 py-1.5 rounded-xl bg-white text-black font-bold hover:bg-slate-200 shadow-md transition-all text-xs flex items-center gap-1">
                  <span>👑</span> Admin
                </button>
                <button
                  type="button"
                  onClick={() => handleQuickDemo("Engineer", "engineer@telemetry.noc", "Jordan Chen (Engineer)")}
                  className="px-3.5 py-1.5 rounded-xl bg-white text-black font-bold hover:bg-slate-200 shadow-md transition-all text-xs flex items-center gap-1">
                  <span>⚡</span> Engineer
                </button>
                <button
                  type="button"
                  onClick={() => handleQuickDemo("Viewer", "auditor@telemetry.noc", "Taylor Vance (Auditor)")}
                  className="px-3.5 py-1.5 rounded-xl bg-white text-black font-bold hover:bg-slate-200 shadow-md transition-all text-xs flex items-center gap-1">
                  <span>👁️</span> Viewer
                </button>
              </div>
            </div>

          </div>
        </div>
      );
    }


    // ==========================================
    // SHARE / OPEN ON ANY DEVICE MODAL
    // ==========================================
    function ShareModal() {
      const { showShareModal, setShowShareModal, addToast } = useContext(AppContext);
      const [lanIp, setLanIp] = useState("192.168.1.60");
      const [copied, setCopied] = useState(false);

      if (!showShareModal) return null;

      const lanUrl = `http://${lanIp}:8080`;
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(lanUrl)}&color=00D2FF&bgcolor=060B14`;

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text);
        setCopied(true);
        addToast("success", "Link Copied!", "Copied address to clipboard.");
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-[#0A101F] border border-slate-700 rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl shadow-cyan-950/40 relative text-left">
            <button 
              onClick={() => setShowShareModal(false)}
              className="absolute top-5 right-5 text-slate-400 hover:text-white p-1 rounded-lg">
              <Icon name="x" className="w-5 h-5" />
            </button>

            <div className="flex items-center gap-3 mb-6">
              <div className="w-10 h-10 rounded-2xl bg-white text-black flex items-center justify-center font-bold shadow-md">
                <Icon name="share-2" className="w-5 h-5 text-black" />
              </div>
              <div>
                <h3 className="font-extrabold text-white text-lg tracking-tight">Open on Any Device & Network</h3>
                <p className="text-xs text-slate-400">Mobile phones, tablets, laptops, and remote networks</p>
              </div>
            </div>

            <div className="space-y-4 text-xs font-mono">
              {/* Method 1: Local Wi-Fi QR Code */}
              <div className="p-4 rounded-2xl bg-[#040812] border border-slate-800 space-y-3">
                <div className="flex items-center justify-between text-white font-bold">
                  <span className="flex items-center gap-2">
                    <Icon name="smartphone" className="w-4 h-4 text-cisco-cyan" />
                    1. Same Wi-Fi Network (Phone / Tablet)
                  </span>
                  <span className="text-[10px] text-emerald-400 bg-emerald-950/40 px-2 py-0.5 rounded border border-emerald-500/30">
                    INSTANT QR SCAN
                  </span>
                </div>

                <div className="flex flex-col sm:flex-row items-center gap-4 pt-1">
                  <div className="p-2 rounded-xl bg-black border border-slate-800 shrink-0 shadow-md">
                    <img 
                      src={qrApiUrl} 
                      alt="Scan to open on phone" 
                      className="w-28 h-28 rounded-lg"
                      onError={(e) => { e.target.style.display = 'none'; }}
                    />
                  </div>
                  <div className="space-y-2 text-left flex-1">
                    <p className="text-slate-300 text-[11px] font-sans">
                      Connect your phone to the same Wi-Fi, open your Camera app, and scan the QR code to open the dashboard instantly:
                    </p>
                    <div className="flex items-center gap-2">
                      <input 
                        type="text" 
                        readOnly 
                        value={lanUrl}
                        className="bg-black border border-slate-800 rounded-lg px-3 py-1.5 text-cisco-cyan text-xs w-full font-bold focus:outline-none"
                      />
                      <button
                        onClick={() => copyToClipboard(lanUrl)}
                        className="px-3 py-1.5 bg-white text-black font-extrabold rounded-lg hover:bg-slate-200 transition-all shrink-0">
                        {copied ? "Copied!" : "Copy"}
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              {/* Method 2: Global Public Access (Any Network Worldwide) */}
              <div className="p-4 rounded-2xl bg-[#040812] border border-slate-800 space-y-2.5">
                <div className="flex items-center justify-between text-white font-bold">
                  <span className="flex items-center gap-2">
                    <Icon name="globe" className="w-4 h-4 text-cisco-cyan" />
                    2. Any Network Worldwide (Cellular 4G/5G / Remote)
                  </span>
                  <span className="text-[10px] text-cisco-cyan bg-cyan-950/40 px-2 py-0.5 rounded border border-cisco-cyan/30">
                    PUBLIC HTTPS TUNNEL
                  </span>
                </div>
                <p className="text-slate-300 text-[11px] font-sans leading-relaxed">
                  Want to share with judges or open over mobile data outside your Wi-Fi? Double-click <strong className="text-white">share_public.bat</strong> in your project folder.
                </p>
                <div className="p-2.5 rounded-xl bg-black border border-slate-800 text-[11px] text-slate-300">
                  <span className="text-slate-500">$</span> ssh -R 80:localhost:8080 nokey@localhost.run
                </div>
                <p className="text-slate-400 text-[10px] font-sans">
                  Instantly provides a global public HTTPS link (e.g. <span className="text-cisco-cyan">https://your-pipeline.lhrtunnel.link</span>) accessible on any device on Earth with zero setup.
                </p>
              </div>

              {/* Method 3: 24/7 Permanent Free Cloud Deploy */}
              <div className="p-4 rounded-2xl bg-[#040812] border border-slate-800 space-y-2">
                <div className="flex items-center justify-between text-white font-bold">
                  <span className="flex items-center gap-2">
                    <Icon name="zap" className="w-4 h-4 text-emerald-400" />
                    3. Permanent 24/7 Free Cloud Hosting
                  </span>
                  <span className="text-[10px] text-slate-400">NETLIFY / GITHUB</span>
                </div>
                <p className="text-slate-300 text-[11px] font-sans">
                  The frontend is completely self-contained in <strong className="text-white">index.html</strong>. Drag-and-drop the project folder to <a href="https://app.netlify.com/drop" target="_blank" className="text-cisco-cyan hover:underline font-bold">app.netlify.com/drop</a> for a permanent free URL!
                </p>
              </div>
            </div>

            <div className="mt-6 flex justify-end">
              <button 
                onClick={() => setShowShareModal(false)}
                className="px-6 py-2.5 rounded-xl bg-white text-black font-extrabold text-xs hover:bg-slate-200 shadow-md transition-all">
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- MAIN APP WRAPPER ---
    function App() {
      const { activePage, isAuthenticated } = useContext(AppContext);

      if (!isAuthenticated) {
        return (
          <>
            <LoginPage />
            <ToastContainer />
          </>
        );
      }

      return (
        <div className="flex flex-col min-h-screen">
          <Header />
          <div className="flex flex-1">
            <Sidebar />
            <main className="flex-1 p-6 md:p-8 max-w-7xl mx-auto w-full">
              {activePage === "home" && <HomePage />}
              {activePage === "dashboard" && <DashboardPage />}
              {activePage === "stream" && <StreamPage />}
              {activePage === "validation" && <ValidationPage />}
              {activePage === "devices" && <DevicesPage />}
              {activePage === "alerts" && <AlertsPage />}
              {activePage === "architecture" && <ArchitecturePage />}
              {activePage === "analytics" && <AnalyticsPage />}
              {activePage === "about" && <AboutPage />}
            </main>
          </div>
          <MobileNav />
          <ToastContainer />
          <AiAnomalyModal />
          <ShareModal />
        </div>
      );
    }

    // Mount Application cleanly
    const rootEl = document.getElementById('root');
    const root = ReactDOM.createRoot(rootEl);
    root.render(
      <AppProvider>
        <App />
      </AppProvider>
    );
    rootEl.setAttribute('data-mounted', 'true');
  </script>
</body>
</html>
